name: Breadcrumb

options:
  bundleIdPrefix: com.tarun
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 14.0

targets:
  Breadcrumb:
    type: application
    platform: macOS
    sources:
      - path: Breadcrumb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarun.breadcrumb
        PRODUCT_NAME: Breadcrumb
        MARKETING_VERSION: 0.11.1
        CURRENT_PROJECT_VERSION: 5
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Breadcrumb
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 86LW992PDB
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO

  BreadcrumbTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BreadcrumbTests
    dependencies:
      - target: Breadcrumb
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
